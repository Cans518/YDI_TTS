name: Build and package

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional draft release tag, for example v1.2.0'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  QT_VERSION: '6.8.2'
  QT_FORCE_STDERR_LOGGING: '1'
  BUILD_JOBS: '2'

jobs:
  linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install system build and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf desktop-file-utils libfuse2 \
            libgl1-mesa-dev libegl1-mesa-dev libxcb-cursor0 libxkbcommon-x11-0 \
            libxcb-xinerama0 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            xvfb weston
      - name: Set up Python for Qt tools
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VERSION }}
          setup-python: false
          modules: qtserialport qt5compat
          cache: true
      - name: Build, test and package
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/package-linux.sh
      - name: Upload Linux package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x86_64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload Linux test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-linux-x86_64
          path: |
            build/linux/tests.xml
            build/linux/verification/
            build/linux/Testing/Temporary/
            build/linux/weston.log
            build/linux/tools/tools.json
          if-no-files-found: ignore

  macos:
    name: macOS ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python for Qt tools
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VERSION }}
          setup-python: false
          modules: qtserialport qt5compat
          cache: true
      - name: Build, test and package
        env:
          YDI_ARCH: ${{ matrix.arch }}
        run: bash scripts/package-macos.sh
      - name: Upload macOS package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
      - name: Upload macOS test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-macos-${{ matrix.arch }}
          path: |
            build/macos/tests.xml
            build/macos/verification/
            build/macos/Testing/Temporary/
          if-no-files-found: ignore

  windows:
    name: Windows x86_64 validation
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python for Qt tools
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install Qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4
        with:
          version: ${{ env.QT_VERSION }}
          setup-python: false
          arch: win64_msvc2022_64
          modules: qtserialport
          cache: true
      - name: Build and test
        shell: pwsh
        run: |
          cmake -S . -B build/ci -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" -DYDI_SINGLE_FILE=OFF -DYDI_DEPLOY_RUNTIME=OFF -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw 'Configuration failed.' }
          cmake --build build/ci --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_DEBUG_PLUGINS = '1'
          $env:YDI_UI_CAPTURE_DIR = Join-Path $pwd 'build/ci/verification'
          ctest --test-dir build/ci -C Release --output-on-failure --output-junit build/ci/tests.xml
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
      - name: Upload Windows test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-windows-x86_64
          path: |
            build/ci/tests.xml
            build/ci/verification/
            build/ci/Testing/Temporary/
          if-no-files-found: ignore

  release:
    name: Prepare draft release
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [linux, macos, windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create checked release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$RELEASE_TAG" = "v$(python3 scripts/release-metadata.py version)"
          python3 scripts/release-metadata.py manifest dist
          gh release create "$RELEASE_TAG" dist/* --draft --target "$GITHUB_SHA" \
            --title "YDI TTS $RELEASE_TAG" --notes-file docs/releases/v1.2.0.md
